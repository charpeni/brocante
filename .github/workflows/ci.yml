name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Lint
            command: pnpm lint
          - name: Formatting
            command: pnpm format:check
          - name: Type checks
            command: pnpm check
          - name: Unit tests
            command: pnpm test
          - name: Build
            command: pnpm build
          - name: Plugin verification
            command: pnpm --filter bb-plugin-brocante verify:bundle
          - name: CLI packaging
            command: pnpm --filter brocante pack --pack-destination /tmp/brocante-packages
          - name: E2E tests
            command: pnpm test:e2e
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - if: matrix.name == 'Plugin verification' && startsWith(github.ref, 'refs/tags/bb-plugin/')
        run: pnpm --filter bb-plugin-brocante verify:tag "$GITHUB_REF_NAME"
      - if: matrix.name == 'E2E tests'
        run: pnpm --filter @brocante/web exec playwright install --with-deps chromium
      - name: Run ${{ matrix.name }}
        run: ${{ matrix.command }}
      - name: Upload E2E failure artifacts
        if: failure() && matrix.name == 'E2E tests'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-e2e-${{ github.run_attempt }}
          path: |
            packages/web/playwright-report/
            packages/web/test-results/
          retention-days: 7
