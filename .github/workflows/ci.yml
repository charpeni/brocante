name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - if: startsWith(github.ref, 'refs/tags/bb-plugin/')
        run: pnpm --filter bb-plugin-brocante verify:tag "$GITHUB_REF_NAME"
      - run: pnpm --filter bb-plugin-brocante verify:bundle
      - run: pnpm validate
      - run: pnpm --filter @brocante/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm --filter brocante pack --pack-destination /tmp/brocante-packages
