name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Lint
            command: pnpm lint
          - name: Formatting
            command: pnpm format:check
          - name: Type checks
            command: pnpm check
          - name: Unit tests
            command: pnpm test
          - name: Build
            command: pnpm build
          - name: Plugin verification
            command: pnpm --filter bb-plugin-brocante verify:bundle
          - name: CLI packaging
            command: pnpm --filter brocante pack --pack-destination /tmp/brocante-packages
          - name: E2E tests
            command: pnpm test:e2e
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - if: matrix.name == 'Plugin verification' && startsWith(github.ref, 'refs/tags/bb-plugin/')
        run: pnpm --filter bb-plugin-brocante verify:tag "$GITHUB_REF_NAME"
      - if: matrix.name == 'E2E tests'
        run: pnpm --filter @brocante/web exec playwright install --with-deps chromium
      - name: Run ${{ matrix.name }}
        run: ${{ matrix.command }}
